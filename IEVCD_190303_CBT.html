<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>시각디자인산업기사 CBT — 2019년 03월 03일 필기 기출</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Pretendard');
  }
  :root{
    --paper:#F6F4EE;
    --paper-2:#EFEBE0;
    --ink:#20241F;
    --ink-soft:#5B5A50;
    --line:#D9D2C1;
    --red:#B5362A;
    --red-soft:#F1DED9;
    --stamp:#1F4B3F;
    --stamp-soft:#DCE7DF;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  .serif{ font-family:'Noto Serif KR','Nanum Myeongjo',serif; }

  /* ===== Top bar ===== */
  header.topbar{
    position:sticky; top:0; z-index:50;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:10px 16px 8px;
  }
  .topbar-row1{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .exam-title{
    font-size:15px; font-weight:700; letter-spacing:-0.01em;
  }
  .exam-sub{
    font-size:11.5px; color:var(--ink-soft); margin-top:1px;
  }
  .timer{
    font-variant-numeric: tabular-nums;
    font-size:20px; font-weight:700; color:var(--red);
    white-space:nowrap;
  }
  .topbar-row2{
    display:flex; align-items:center; gap:10px; margin-top:8px;
  }
  .progress-track{
    flex:1; height:5px; background:var(--paper-2);
    border-radius:99px; overflow:hidden; border:1px solid var(--line);
  }
  .progress-fill{
    height:100%; background:var(--stamp); width:0%;
    transition:width .25s ease;
  }
  .progress-label{
    font-size:11.5px; color:var(--ink-soft); white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }
  .topbar-row3{
    display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;
  }
  button.pill{
    font-family:inherit; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:6px 12px; border-radius:99px; cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  button.pill:hover{ border-color:var(--ink); }
  button.pill.primary{
    background:var(--stamp); border-color:var(--stamp); color:#fff;
  }
  button.pill.primary:hover{ background:#163a30; }
  button.pill.ghost-red{ color:var(--red); border-color:var(--red-soft); }
  button.pill.ghost-red:hover{ background:var(--red-soft); }
  button.pill:disabled{ opacity:.4; cursor:not-allowed; }

  /* ===== Result panel ===== */
  #resultPanel{
    display:none;
    margin:14px 16px 0;
    border:1px solid var(--line);
    background:#fff;
    padding:14px 16px;
    border-radius:var(--radius);
  }
  #resultPanel.show{ display:block; }
  .result-headline{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .result-score{
    font-family:'Noto Serif KR',serif;
    font-size:34px; font-weight:800; color:var(--stamp);
  }
  .result-score small{ font-size:15px; font-weight:600; color:var(--ink-soft); }
  .result-verdict{
    font-size:13px; font-weight:700; padding:3px 10px; border-radius:99px;
  }
  .verdict-pass{ background:var(--stamp-soft); color:var(--stamp); }
  .verdict-fail{ background:var(--red-soft); color:var(--red); }
  .subject-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:8px; margin-top:12px;
  }
  .subject-cell{
    border:1px solid var(--line); padding:8px 10px; border-radius:var(--radius);
    font-size:12.5px;
  }
  .subject-cell .name{ color:var(--ink-soft); margin-bottom:2px; }
  .subject-cell .score{ font-weight:700; font-variant-numeric: tabular-nums; }
  .subject-cell.warn .score{ color:var(--red); }
  .result-note{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; }

  /* ===== Subject divider ===== */
  .subject-divider{
    margin:26px 16px 10px;
    padding-bottom:6px;
    border-bottom:2px solid var(--ink);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .subject-divider h2{
    font-family:'Noto Serif KR',serif;
    font-size:16px; margin:0; font-weight:700;
  }
  .subject-divider span{ font-size:11.5px; color:var(--ink-soft); }

  /* ===== Question card ===== */
  .qcard{
    margin:0 16px 12px;
    background:#fff;
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px 12px;
  }
  .qcard.hide{ display:none; }
  .qhead{
    display:flex; gap:8px; margin-bottom:8px;
  }
  .qnum{
    font-family:'Noto Serif KR',serif;
    font-weight:800; font-size:14px; color:var(--ink-soft);
    min-width:26px;
  }
  .qtext{ font-size:14px; white-space:pre-line; }
  .qbox{
    margin:8px 0 8px 34px;
    padding:8px 10px;
    background:var(--paper-2);
    border-left:2px solid var(--line);
    font-size:12.5px; color:var(--ink-soft);
    white-space:pre-line;
  }
  .opts{ margin-left:34px; }
  .opt{
    display:flex; align-items:flex-start; gap:8px;
    padding:6px 8px; border-radius:var(--radius);
    cursor:pointer; font-size:13.5px;
    border:1px solid transparent;
  }
  .opt:hover{ background:var(--paper-2); }
  .opt input{ margin-top:3px; accent-color:var(--stamp); flex:none; }
  .opt .mark{
    width:16px; flex:none; text-align:center; font-weight:800; font-size:13px;
  }
  .opt.mark-correct{ background:var(--stamp-soft); }
  .opt.mark-correct .mark{ color:var(--stamp); }
  .opt.mark-wrong{ background:var(--red-soft); }
  .opt.mark-wrong .mark{ color:var(--red); }

  .qcard.graded.correct{ border-left-color:var(--stamp); }
  .qcard.graded.wrong{ border-left-color:var(--red); }
  .qcard.graded.empty{ border-left-color:#B8975B; }

  .qfoot{
    margin-left:34px; margin-top:6px; font-size:11.5px;
    display:none; gap:8px; align-items:center;
  }
  .qcard.graded .qfoot{ display:flex; }
  .tag{
    font-weight:700; padding:1px 7px; border-radius:99px; font-size:11px;
  }
  .tag.correct{ background:var(--stamp-soft); color:var(--stamp); }
  .tag.wrong{ background:var(--red-soft); color:var(--red); }
  .tag.empty{ background:#F2E7D3; color:#8A6A2C; }

  footer.note{
    margin:30px 16px 0; font-size:11.5px; color:var(--ink-soft);
    border-top:1px solid var(--line); padding-top:12px;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row1">
    <div>
      <div class="exam-title serif">시각디자인산업기사 필기 기출문제</div>
      <div class="exam-sub">2019년 03월 03일 시행 · 4과목 80문항</div>
    </div>
    <div class="timer" id="timer">100:00</div>
  </div>
  <div class="topbar-row2">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 80 답변</div>
  </div>
  <div class="topbar-row3">
    <button class="pill primary" id="btnGrade">채점하기</button>
    <button class="pill" id="btnAnalysis">문항별 분석</button>
    <button class="pill ghost-red" id="btnWrongOnly">오답만 보기</button>
    <button class="pill" id="btnReset">처음부터</button>
  </div>
</header>

<div id="resultPanel">
  <div class="result-headline">
    <div class="result-score serif" id="resultScore">0<small> / 80점</small></div>
    <div class="result-verdict" id="resultVerdict">-</div>
  </div>
  <div class="subject-grid" id="subjectGrid"></div>
  <div class="result-note">과목당 40점(8문항) 미만 시 과락, 평균 60점 이상이어야 합격입니다. (산업기사 필기 기준)</div>
</div>

<div id="quizRoot"></div>

<footer class="note">
  전자문제집 CBT(www.comcbt.com) 공개 기출문제를 바탕으로 제작한 개인 학습용 페이지입니다. 실제 CBT 화면 구성과 다를 수 있으니 최종 점검은 큐넷 공식 자료로 함께 확인해 주세요.
</footer>

<script>
const SUBJECTS = [
  {key:1, name:"1과목 · 색채학", range:[1,20]},
  {key:2, name:"2과목 · 인쇄 및 사진기법", range:[21,40]},
  {key:3, name:"3과목 · 시각디자인론", range:[41,60]},
  {key:4, name:"4과목 · 시각디자인실무 이론", range:[61,80]},
];

// answer: 0-indexed correct option
const QUESTIONS = [
{id:1, s:1, q:"다음 중 주목성이 가장 높은 색은?", o:["적색","회색","녹색","청색"], a:0},
{id:2, s:1, q:"실내 색채계획 시 고려해야 할 사항이 아닌 것은?", o:["공간 설계자 중심의 색채계획 반영","인간과 공간의 조화","환경에 해가 되지 않는 재료와 색채의 선택","공간의 아이덴티티 형성"], a:0},
{id:3, s:1, q:"색상환에 관한 설명으로 옳은 것은?", o:["서로 인접한 두 색을 혼합하여 만들어진 색을 중성색이라 한다.","색상환에서 가장 거리가 먼 쪽에 있는 색을 유사색이라 한다.","원을 이용하여 연속적인 질서를 가지는 색의 관계를 명확하게 나타낸 것을 색상환이라 한다.","색상환을 통해 색혼합의 결과로 나타나는 중간색들을 예측할 수는 없다."], a:2},
{id:4, s:1, q:"CIE 색채계에서 3개의 원자극(원색) 색인 것은?", o:["RGY","GYC","CBR","RGB"], a:3},
{id:5, s:1, q:"서로 다른 두 색을 인접시켰을 때 서로의 영향으로 밝은 색은 더 밝게, 어두운 색은 더 어둡게 보이는 현상은?", o:["명도대비","색상대비","채도대비","연변대비"], a:0},
{id:6, s:1, q:"다음 중 노란색의 가시광선 상 파장 분포와 유사한 것은?", o:["780 ~ 920 nm","600 ~ 700 nm","570 ~ 590 nm","450 ~ 500 nm"], a:2},
{id:7, s:1, q:"먼셀 기호 ′2.5B 4/8′에서 명도 값은?", o:["2.5","4","8","12"], a:1},
{id:8, s:1, q:"ISCC-NIST 의 색명법상 bG는 어떤 색상인가?", o:["blue green","bluish green","greenish blue","blight green"], a:1},
{id:9, s:1, q:"영·헬름홀츠(Young·Helmholtz)의 이론에 대한 설명으로 틀린 것은?", o:["세 개의 서로 다른 파장을 혼합하여 다른 어떤 파장과도 동일한 색을 만들 수 없음을 증명하였다.","인간의 망막에는 3종류의 색광에 감광하는 수용기가 있다.","다양한 색을 재현하는 컬러TV에 응용되고 있다.","이성체는 물리적으로 다르지만 지각적으로 동일한 것으로 경험되는 자극을 말한다."], a:0},
{id:10, s:1, q:"색의 3속성에 대한 설명 중 옳은 것은?", o:["색의 3속성은 색채의 차이를 변별하는데 영향을 주지 못한다.","색상은 색을 느끼는 강약, 맑기, 선명도이다.","무채색의 밝기는 표면에서의 빛의 반사율과 흡수율로 정해진다.","채도는 물체의 표면에서 반사되는 주파장에 의해 결정된다."], a:2},
{id:11, s:1, q:"오스트발트의 색채조화론과 관련이 있는 것은?", o:["균형점","균형의 원리","등순색계열의 조화","미도"], a:2},
{id:12, s:1, q:"감법혼색의 설명 중 틀린 것은?", o:["색을 더할수록 밝기가 감소하는 색혼합으로, 어두워지는 혼색을 말한다.","감법혼색은 색필터 또는 기타 흡수매질의 중첩에 따라 색이 흡수되어 다른색이 생기는 것이다.","인쇄시 색료의 3원색인 C, M, Y 로는 순수한 검은색을 얻지 못하므로, K(검정색)를 추가하여 사용한다.","2가지 이상의 색자극을 반복시키는 계시혼합의 원리에 의해 색이 혼합되어 보이는 것이다."], a:3},
{id:13, s:1, q:"색의 동화현상에 대한 설명으로 옳은 것은?", o:["어느 영역의 색이 그 주변색의 영향을 받아 주변색과 이질적으로 변화하는 효과를 말한다.","관찰을 반복하면 동화현상이 일어나기 어렵다.","점이나 선의 크기와 밀접하게 관계되지만 관찰거리에는 영향을 받지 않는다.","동화현상의 종류는 명도동화, 색상동화, 채도동화, 색조동화가 있다."], a:1},
{id:14, s:1, q:"다음에서 설명하고 있는 순응 현상은?", box:"- 추상체와 간상체가 모두 활동하고 있는 시각상태이다.\n- 시간적으로는 해뜨기 직전 혹은 날이 저물어 어두워지기 시작하면 나타나는 현상이다.\n- 이때에는 시각적인 정확성이 떨어진다.", o:["박명시","명소시","항상시","암소시"], a:0},
{id:15, s:1, q:"디지털컬러 입력장치에 대한 설명으로 틀린 것은?", o:["대상물에 빛을 비추어 그 반사광 또는 투과광을 센서로 판독하여 컴퓨터로 전달하는 것을 스캐너라고 한다.","스캐너와 디지털 카메라는 장치 내부에 고정된 광원을 사용한다.","스캐너의 종류는 주사방식에 따라 회전드럼형, 플랫배드형, 핸디형 등이 있다.","디지털카메라는 이미지센서 및 디지털메모리를 사용해서 화상을 획득하고 기록한다."], a:1},
{id:16, s:1, q:"색채조화에 관한 설명 중 옳지 않은 것은?", o:["색채조화란 2색 또는 3색 이상의 다색배색에 질서를 부여하는 것이다.","배색간의 조화원리를 규명하여 일반적이고 객관적인 원리로 체계화한 것이다.","색채조화의 공통되는 원리로 질서, 명료성, 동류, 유사, 대비의 원리 등이 있다.","색채조화의 보편적 원칙을 추구하는 색채조화론에 의존하는 것이 좋다."], a:3},
{id:17, s:1, q:"회전혼색에 대한 설명으로 옳지 않은 것은?", o:["망막에 동시에 자극을 준 결과이다.","계시혼색, 순차혼색, 연속혼색 이라고도 한다.","동일지점에 2가지 이상의 색자극을 반복시키는 원리에 의한 것이다.","혼합된 색의 명도는 혼합하려는 색들의 중간명도가 된다."], a:0},
{id:18, s:1, q:"GIF 포맷에서 재현할 수 있는 컬러의 수는?", o:["216","236","255","256"], a:3},
{id:19, s:1, q:"문·스펜서의 색채조화론과 관련이 있는 것은?", o:["조화와 부조화","질서의 원리","친숙의 원리","윤성 조화"], a:0},
{id:20, s:1, q:"다음 중 색채조절의 3요소가 아닌 것은?", o:["명시성","작업의욕","순응","안전성"], a:2},

{id:21, s:2, q:"다음 중 구텐베르크에 의해 사용된 최초의 인쇄방식은?", o:["원압식","평압식","윤전식","공판식"], a:1},
{id:22, s:2, q:"다음 중 현상주약에 해당되지 않는 것은?", o:["메톨","페니돈","하이드로퀴논","아황산나트륨"], a:3},
{id:23, s:2, q:"다음 괄호 안에 들어갈 알맞은 용어는?", box:"다게레오 타입은 은판사진술이라고도 하며 은판을 요오드 용액에 처리하며 요오드화은 감광막이 생기게 된다. 완성된 요오드화은은 감광막을 다게레오 타입 카메라로 촬영한 뒤 (　) 에 현상하며 식염 포화액으로 미감광 요오드화은을 제거하여 정착하는 방법이다.", o:["질산","식염수","몰식자산","수은 증기"], a:3},
{id:24, s:2, q:"광각렌즈에 대한 설명으로 틀린 것은?", o:["원근감이 과장된다.","피사계심도가 깊다.","화각이 35° 내외로서 좁다.","화면의 대각선 길이보다 초점거리가 짧다."], a:2},
{id:25, s:2, q:"다음 광선 중 인물의 입체적 표현에 가장 적합한 것은?", o:["역광","반역광","사광","정면광"], a:2},

const PASS_TOTAL = 60;     // 평균 60점 이상
const PASS_SUBJECT = 40;   // 과목당 40점 이상 (8/20문항)

// ===== State =====
const answers = {}; // id -> selected index
let graded = false;
let wrongOnlyMode = false;
let timeLeft = 100 * 60;
let timerHandle = null;

// ===== Render questions =====
const root = document.getElementById('quizRoot');
SUBJECTS.forEach(sub=>{
  const divider = document.createElement('div');
  divider.className = 'subject-divider';
  divider.innerHTML = `<h2 class="serif">${sub.name}</h2><span>${sub.range[0]}~${sub.range[1]}번</span>`;
  root.appendChild(divider);

  QUESTIONS.filter(q=>q.s===sub.key).forEach(q=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    card.id = 'card-'+q.id;

    let html = `<div class="qhead">
        <div class="qnum serif">${q.id}.</div>
        <div class="qtext">${q.q}</div>
      </div>`;
    if(q.box){
      html += `<div class="qbox">${q.box}</div>`;
    }
    html += `<div class="opts">`;
    q.o.forEach((opt, idx)=>{
      html += `<label class="opt" data-qid="${q.id}" data-idx="${idx}">
        <input type="radio" name="q${q.id}" value="${idx}">
        <span class="mark"></span>
        <span>${opt}</span>
      </label>`;
    });
    html += `</div><div class="qfoot"><span class="tag" id="tag-${q.id}"></span></div>`;
    card.innerHTML = html;
    root.appendChild(card);
  });
});

// option click handling
root.addEventListener('click', (e)=>{
  const label = e.target.closest('.opt');
  if(!label) return;
  const qid = Number(label.dataset.qid);
  const idx = Number(label.dataset.idx);
  answers[qid] = idx;
  updateProgress();
});

function updateProgress(){
  const answered = Object.keys(answers).length;
  document.getElementById('progressFill').style.width = (answered/80*100)+'%';
  document.getElementById('progressLabel').textContent = `${answered} / 80 답변`;
}

// ===== Timer =====
function fmt(t){
  const m = Math.floor(t/60), s = t%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function startTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(()=>{
    if(graded){ clearInterval(timerHandle); return; }
    timeLeft--;
    document.getElementById('timer').textContent = fmt(Math.max(timeLeft,0));
    if(timeLeft<=0){
      clearInterval(timerHandle);
      gradeExam();
    }
  }, 1000);
}
document.getElementById('timer').textContent = fmt(timeLeft);
startTimer();

// ===== Grading =====
function gradeExam(){
  graded = true;
  clearInterval(timerHandle);

  let correctCount = 0;
  const subjectStats = {}; // key -> {correct, total}
  SUBJECTS.forEach(s=> subjectStats[s.key] = {correct:0,total:0});

  QUESTIONS.forEach(q=>{
    const card = document.getElementById('card-'+q.id);
    const chosen = answers[q.id];
    const isCorrect = chosen === q.a;
    subjectStats[q.s].total++;
    if(isCorrect) subjectStats[q.s].correct++;
    if(isCorrect) correctCount++;

    card.classList.add('graded');
    card.classList.toggle('correct', isCorrect);
    card.classList.toggle('wrong', chosen!==undefined && !isCorrect);
    card.classList.toggle('empty', chosen===undefined);

    card.querySelectorAll('.opt').forEach(optEl=>{
      const idx = Number(optEl.dataset.idx);
      const markEl = optEl.querySelector('.mark');
      optEl.classList.remove('mark-correct','mark-wrong');
      markEl.textContent = '';
      if(idx===q.a){
        optEl.classList.add('mark-correct');
        markEl.textContent = '○';
      }
      if(chosen!==undefined && idx===chosen && chosen!==q.a){
        optEl.classList.add('mark-wrong');
        markEl.textContent = '✕';
      }
    });

    const tag = document.getElementById('tag-'+q.id);
    if(chosen===undefined){ tag.textContent='미답'; tag.className='tag empty'; }
    else if(isCorrect){ tag.textContent='정답'; tag.className='tag correct'; }
    else { tag.textContent='오답'; tag.className='tag wrong'; }
  });

  // score out of 80 -> normalize to 100
  const scorePer = Math.round(correctCount/80*100);
  document.getElementById('resultScore').innerHTML = `${scorePer}<small> / 100점 (${correctCount}/80문항)</small>`;

  const grid = document.getElementById('subjectGrid');
  grid.innerHTML = '';
  let subjectPass = true;
  SUBJECTS.forEach(s=>{
    const stat = subjectStats[s.key];
    const pct = Math.round(stat.correct/stat.total*100);
    if(pct < PASS_SUBJECT) subjectPass = false;
    const cell = document.createElement('div');
    cell.className = 'subject-cell'+(pct<PASS_SUBJECT?' warn':'');
    cell.innerHTML = `<div class="name">${s.name}</div><div class="score">${pct}점 (${stat.correct}/${stat.total})</div>`;
    grid.appendChild(cell);
  });

  const verdict = document.getElementById('resultVerdict');
  const passed = subjectPass && scorePer >= PASS_TOTAL;
  verdict.textContent = passed ? '합격 기준 충족' : '합격 기준 미충족';
  verdict.className = 'result-verdict ' + (passed ? 'verdict-pass' : 'verdict-fail');

  document.getElementById('resultPanel').classList.add('show');
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth', block:'start'});

  applyWrongFilter();
}

// ===== Buttons =====
document.getElementById('btnGrade').addEventListener('click', gradeExam);

document.getElementById('btnAnalysis').addEventListener('click', ()=>{
  if(!graded){ gradeExam(); return; }
  document.getElementById('resultPanel').scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('btnWrongOnly').addEventListener('click', ()=>{
  if(!graded){ alert('먼저 채점하기를 눌러주세요.'); return; }
  wrongOnlyMode = !wrongOnlyMode;
  document.getElementById('btnWrongOnly').textContent = wrongOnlyMode ? '전체 문항 보기' : '오답만 보기';
  applyWrongFilter();
});

function applyWrongFilter(){
  QUESTIONS.forEach(q=>{
    const card = document.getElementById('card-'+q.id);
    const isWrong = answers[q.id] !== q.a;
    card.classList.toggle('hide', wrongOnlyMode && graded && !isWrong);
  });
}

document.getElementById('btnReset').addEventListener('click', ()=>{
  if(!confirm('처음부터 다시 푸시겠습니까? 현재 답안과 채점 결과가 모두 초기화됩니다.')) return;
  Object.keys(answers).forEach(k=>delete answers[k]);
  graded = false;
  wrongOnlyMode = false;
  timeLeft = 100*60;
  document.getElementById('btnWrongOnly').textContent = '오답만 보기';
  document.getElementById('resultPanel').classList.remove('show');
  document.querySelectorAll('.qcard').forEach(card=>{
    card.classList.remove('graded','correct','wrong','empty','hide');
  });
  document.querySelectorAll('.opt').forEach(optEl=>{
    optEl.classList.remove('mark-correct','mark-wrong');
    optEl.querySelector('.mark').textContent='';
  });
  document.querySelectorAll('input[type=radio]').forEach(r=> r.checked=false);
  document.querySelectorAll('.tag').forEach(t=>{ t.textContent=''; t.className='tag'; });
  updateProgress();
  document.getElementById('timer').textContent = fmt(timeLeft);
  startTimer();
  window.scrollTo({top:0, behavior:'smooth'});
});

updateProgress();
</script>
</body>
</html>
