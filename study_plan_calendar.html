<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시각디자인 산업기사 학습 플랜 2026</title>
<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --border: #E8E6E0;
    --border-strong: #D0CEC8;
    --text-primary: #1A1916;
    --text-secondary: #6B6862;
    --text-muted: #9B9890;
    --s1-bg: #EAF5EE;
    --s1-text: #2D6B42;
    --s1-border: #A8D8B8;
    --s2-bg: #E8F0FB;
    --s2-text: #1E4F9E;
    --s2-border: #A8C0EE;
    --s3-bg: #FEF3E2;
    --s3-text: #8A5010;
    --s3-border: #F0C878;
    --exam-bg: #FDECEA;
    --exam-text: #962020;
    --exam-border: #F0A0A0;
    --rest-bg: #F2F0EB;
    --rest-text: #5A5855;
    --accent: #2D6B42;
    --today-ring: #2D6B42;
    --exam-day-bg: #FFF5F5;
    --progress-fill: #2D6B42;
    --header-bg: #1A1916;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 3rem;
  }

  /* Header */
  .header {
    background: var(--header-bg);
    color: #fff;
    padding: 2rem 2rem 1.5rem;
  }
  .header-inner { max-width: 1100px; margin: 0 auto; }
  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    color: #fff;
  }
  .header-meta {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
  }
  .header-meta span {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    font-size: 12px;
  }
  .header-meta span.accent-tag {
    background: var(--accent);
    color: #fff;
    opacity: 1;
  }

  /* Progress */
  .progress-wrap {
    max-width: 1100px;
    margin: 1.5rem auto 0;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .progress-label { font-size: 12px; color: rgba(255,255,255,0.5); white-space: nowrap; }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #6FCF97;
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-pct { font-size: 12px; color: rgba(255,255,255,0.6); white-space: nowrap; min-width: 36px; }

  /* Main */
  .main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 0; }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-bottom: 2rem;
    padding: 1rem 1.25rem;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    align-items: center;
  }
  .legend-title { font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 4px; }
  .leg {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* Month block */
  .month-block { margin-bottom: 2.5rem; }
  .month-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.06em;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--text-primary);
    display: inline-block;
  }

  /* Calendar grid */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border: 0.5px solid var(--border-strong);
    border-radius: 10px;
    overflow: hidden;
  }
  .cal-dow {
    background: var(--header-bg);
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    text-align: center;
    padding: 7px 4px;
    letter-spacing: 0.05em;
    font-weight: 500;
  }
  .cal-dow:first-child { color: rgba(255,120,120,0.7); }
  .cal-dow:last-child { color: rgba(120,160,255,0.7); }

  .cal-cell {
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    border-left: 0.5px solid var(--border);
    min-height: 80px;
    padding: 6px 5px;
    vertical-align: top;
    position: relative;
  }
  .cal-cell:nth-child(7n+2) { border-left: none; } /* 첫 열 */
  .cal-cell.empty { background: var(--bg); }
  .cal-cell.today {
    background: #F0FBF3;
    box-shadow: inset 0 0 0 2px var(--today-ring);
  }
  .cal-cell.exam-day { background: var(--exam-day-bg); }

  .day-num {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 4px;
    line-height: 1;
  }
  .cal-cell.today .day-num {
    color: var(--accent);
    font-weight: 700;
  }
  .cal-cell.sun .day-num { color: #C0302A; }
  .cal-cell.sat .day-num { color: #2A5EC0; }

  /* Task chips */
  .task-chip {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    font-size: 10px;
    line-height: 1.4;
    padding: 3px 5px;
    border-radius: 5px;
    margin-bottom: 3px;
    cursor: pointer;
    user-select: none;
    border: 0.5px solid transparent;
    transition: opacity 0.2s;
  }
  .task-chip.done { opacity: 0.4; text-decoration: line-through; }
  .task-chip input[type=checkbox] { width: 10px; height: 10px; flex-shrink: 0; margin-top: 1px; cursor: pointer; accent-color: var(--accent); }

  .chip-s1 { background: var(--s1-bg); color: var(--s1-text); border-color: var(--s1-border); }
  .chip-s2 { background: var(--s2-bg); color: var(--s2-text); border-color: var(--s2-border); }
  .chip-s3 { background: var(--s3-bg); color: var(--s3-text); border-color: var(--s3-border); }
  .chip-exam { background: var(--exam-bg); color: var(--exam-text); border-color: var(--exam-border); }
  .chip-rest { background: var(--rest-bg); color: var(--rest-text); }
  .chip-badge {
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: 600;
    display: inline-block;
    margin-bottom: 3px;
    letter-spacing: 0.04em;
  }
  .badge-key { background: #1A1916; color: #fff; }
  .badge-exam-day { background: var(--exam-text); color: #fff; }

  /* Sticky notes zone */
  .summary-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 2rem;
  }
  .stat-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
  }
  .stat-label { font-size: 11px; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .stat-val { font-size: 22px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.02em; }
  .stat-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  /* Reset button */
  .btn-reset {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 6px 14px;
    border: 0.5px solid var(--border-strong);
    border-radius: 6px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    margin-top: 6px;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-reset:hover { background: var(--border); }

  @media (max-width: 640px) {
    .cal-cell { min-height: 56px; padding: 4px 3px; }
    .task-chip { font-size: 9px; padding: 2px 3px; }
    .main { padding: 1rem 0.75rem 0; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-eyebrow">Study Planner 2026</div>
    <h1>시각디자인 산업기사 학습 플랜</h1>
    <div class="header-meta">
      <span>시작일: 2026.06.14</span>
      <span>접수 마감: 2026.07.20</span>
      <span>빈자리 추가접수: 07.23 ~ 08.02</span>
      <span class="accent-tag">필기 시험: 2026.08.07 ~</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">진도율</div>
      <div class="progress-bar"><div class="progress-fill" id="pb" style="width:0%"></div></div>
      <div class="progress-pct" id="pb-pct">0%</div>
    </div>
  </div>
</header>

<main class="main">

  <div class="summary-bar">
    <div class="stat-card">
      <div class="stat-label">총 학습일</div>
      <div class="stat-val" id="stat-total">0</div>
      <div class="stat-sub">체크 가능한 날</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">완료</div>
      <div class="stat-val" id="stat-done">0</div>
      <div class="stat-sub">체크 완료</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">남은 날</div>
      <div class="stat-val" id="stat-remain">0</div>
      <div class="stat-sub">D-Day 카운트다운</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">시험까지</div>
      <div class="stat-val" id="stat-dday">-</div>
      <div class="stat-sub">2026.08.07 기준</div>
    </div>
  </div>

  <div class="legend">
    <span class="legend-title">범례</span>
    <div class="leg"><div class="dot" style="background:var(--s1-text)"></div> Subject 1 조사·분석</div>
    <div class="leg"><div class="dot" style="background:var(--s2-text)"></div> Subject 2 기획·구상</div>
    <div class="leg"><div class="dot" style="background:var(--s3-text)"></div> Subject 3 제작</div>
    <div class="leg"><div class="dot" style="background:var(--exam-text)"></div> 기출·모의고사</div>
    <div class="leg"><div class="dot" style="background:var(--rest-text)"></div> 휴식·기념일</div>
  </div>

  <div id="calendar-root"></div>

  <button class="btn-reset" onclick="resetAll()">↺ 전체 초기화</button>
</main>

<script>
const STORAGE_KEY = 'vd_산업기사_2026_v1';

const plan = {
  '2026-06-14': [{t:'S1 Ch01 디자인 개요', c:'s1'}],
  '2026-06-15': [{t:'S1 Ch02 시각 커뮤니케이션', c:'s1'}],
  '2026-06-16': [{t:'S1 Ch03 디자인 관리', c:'s1'}],
  '2026-06-17': [{t:'S1 Ch04 시장환경 조사', c:'s1'}],
  '2026-06-18': [{t:'S1 Ch05 트렌드 조사', c:'s1'}],
  '2026-06-19': [{t:'S1 Ch06 사용자 조사', c:'s1'}],
  '2026-06-20': [{t:'휴식·복습', c:'rest'}],
  '2026-06-21': [{t:'S1 Part02 프로젝트 보고서', c:'s1'}],
  '2026-06-22': [{t:'S1 데이터베이스 관리', c:'s1'}],
  '2026-06-23': [{t:'S1 지식재산권 확보', c:'s1'}],
  '2026-06-24': [{t:'S1 Part03 편집자료 조사·선정', c:'s1'}],
  '2026-06-25': [{t:'S1 연습문제 풀기', c:'s1'}],
  '2026-06-26': [{t:'S1 오답 정리', c:'s1'}],
  '2026-06-27': [{t:'휴식·복습', c:'rest'}],
  '2026-06-28': [{t:'S2 Ch01 디자인 요소 수집', c:'s2'}],
  '2026-06-29': [{t:'S2 Ch02 디자인사', c:'s2'}],
  '2026-06-30': [{t:'S2 Ch03 아트웍', c:'s2'}],
  '2026-07-01': [{t:'S2 Ch04 베리에이션', c:'s2'}],
  '2026-07-02': [{t:'S2 Part02 디자인 요소 응용', c:'s2'}],
  '2026-07-03': [{t:'S2 Part03 프로젝트 기획·구상', c:'s2'}],
  '2026-07-04': [{t:'휴식·복습', c:'rest'}],
  '2026-07-05': [{t:'S2 연습문제 풀기', c:'s2'}],
  '2026-07-06': [{t:'S2 오답 정리', c:'s2'}],
  '2026-07-07': [{t:'S3 Ch01 아이디어 구상·전개', c:'s3'}],
  '2026-07-08': [{t:'S3 Ch02 아이디어 스케치', c:'s3'}],
  '2026-07-09': [{t:'S3 Part02 아이데이션 적용', c:'s3'}],
  '2026-07-10': [{t:'S3 레이아웃 구현', c:'s3'}],
  '2026-07-11': [{t:'휴식·복습', c:'rest'}],
  '2026-07-12': [{t:'S3 타이포그래피 적용', c:'s3'}],
  '2026-07-13': [{t:'S3 색상 선택', c:'s3'}],
  '2026-07-14': [{t:'S3 Part04 인쇄 감리', c:'s3'}],
  '2026-07-15': [{t:'S3 연습문제 풀기', c:'s3'}],
  '2026-07-16': [{t:'S3 오답 정리', c:'s3'}],
  '2026-07-17': [{t:'1~3회 산업기사 모의고사', c:'exam'}],
  '2026-07-18': [{t:'휴식·복습', c:'rest'}],
  '2026-07-19': [{t:'4~6회 모의고사', c:'exam'}],
  '2026-07-20': [{t:'★ 시험 접수 마감', c:'key'}],
  '2026-07-21': [{t:'7~9회 모의고사', c:'exam'}],
  '2026-07-22': [{t:'10~12회 모의고사', c:'exam'}],
  '2026-07-23': [{t:'빈자리 추가접수 시작', c:'key'}],
  '2026-07-24': [{t:'2011~2013 기사 기출', c:'exam'}],
  '2026-07-25': [{t:'휴식·복습', c:'rest'}],
  '2026-07-26': [{t:'2014~2016 기사 기출', c:'exam'}],
  '2026-07-27': [{t:'2017~2019 기사 기출', c:'exam'}],
  '2026-07-28': [{t:'2020~2022 기사 기출', c:'exam'}],
  '2026-07-29': [{t:'전 과목 총정리 ①', c:'exam'}],
  '2026-07-30': [{t:'전 과목 총정리 ②', c:'exam'}],
  '2026-07-31': [{t:'약점 보완·집중 복습', c:'exam'}],
  '2026-08-01': [{t:'빈자리 추가접수 마감', c:'key'}],
  '2026-08-02': [{t:'최종 실전 모의고사', c:'exam'}],
  '2026-08-03': [{t:'휴식·컨디션 조절', c:'rest'}],
  '2026-08-04': [{t:'핵심 개념 암기', c:'exam'}],
  '2026-08-05': [{t:'기출 오답 재확인', c:'exam'}],
  '2026-08-06': [{t:'가볍게 훑기·숙면 준비', c:'rest'}],
  '2026-08-07': [{t:'★ 필기 시험일', c:'exam-day'}],
};

const checkableCats = ['s1','s2','s3','exam'];

let checks = {};
try { checks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) {}

function saveChecks() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checks)); } catch(e) {}
}

function resetAll() {
  if (!confirm('모든 체크를 초기화하시겠습니까?')) return;
  checks = {};
  saveChecks();
  renderAll();
}

function fmtDate(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function updateStats() {
  const taskDates = Object.keys(plan).filter(k => plan[k].some(t => checkableCats.includes(t.c)));
  const total = taskDates.length;
  const done = taskDates.filter(k => checks[k]).length;
  const remain = total - done;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pb').style.width = pct + '%';
  document.getElementById('pb-pct').textContent = pct + '%';
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-remain').textContent = remain;
  const today = new Date('2026-06-14');
  const examDay = new Date('2026-08-07');
  const diff = Math.ceil((examDay - today) / 86400000);
  document.getElementById('stat-dday').textContent = diff > 0 ? 'D-' + diff : diff === 0 ? 'D-Day' : 'D+' + Math.abs(diff);
}

function toggle(key, el) {
  const cb = el.querySelector('input[type=checkbox]');
  setTimeout(() => {
    if (cb.checked) {
      checks[key] = true;
      el.classList.add('done');
    } else {
      delete checks[key];
      el.classList.remove('done');
    }
    saveChecks();
    updateStats();
  }, 0);
}

function renderAll() {
  const root = document.getElementById('calendar-root');
  root.innerHTML = '';
  const months = [
    {year:2026, month:5, label:'6월 (June)'},
    {year:2026, month:6, label:'7월 (July)'},
    {year:2026, month:7, label:'8월 (August)'},
  ];
  const dows = ['일','월','화','수','목','금','토'];
  const todayKey = '2026-06-14';

  months.forEach(({year, month, label}) => {
    const block = document.createElement('div');
    block.className = 'month-block';
    const title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = `2026년 ${label}`;
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';

    dows.forEach(d => {
      const th = document.createElement('div');
      th.className = 'cal-dow';
      th.textContent = d;
      grid.appendChild(th);
    });

    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();

    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = fmtDate(year, month, d);
      const dow = new Date(year, month, d).getDay();
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (key === todayKey) cell.classList.add('today');
      if (key === '2026-08-07') cell.classList.add('exam-day');
      if (dow === 0) cell.classList.add('sun');
      if (dow === 6) cell.classList.add('sat');

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      cell.appendChild(num);

      if (plan[key]) {
        plan[key].forEach(({t, c}) => {
          if (c === 'key') {
            const badge = document.createElement('div');
            badge.className = 'chip-badge badge-key';
            badge.textContent = t;
            cell.appendChild(badge);
          } else if (c === 'exam-day') {
            const badge = document.createElement('div');
            badge.className = 'chip-badge badge-exam-day';
            badge.textContent = t;
            cell.appendChild(badge);
          } else if (c === 'rest') {
            const chip = document.createElement('div');
            chip.className = 'task-chip chip-rest';
            chip.textContent = t;
            cell.appendChild(chip);
          } else {
            const chipClass = c === 's1' ? 'chip-s1' : c === 's2' ? 'chip-s2' : c === 's3' ? 'chip-s3' : 'chip-exam';
            const chip = document.createElement('label');
            chip.className = `task-chip ${chipClass}`;
            if (checks[key]) chip.classList.add('done');
            chip.onclick = function(e) { toggle(key, chip); };
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!checks[key];
            cb.onclick = function(e) { e.stopPropagation(); };
            const span = document.createElement('span');
            span.textContent = t;
            chip.appendChild(cb);
            chip.appendChild(span);
            cell.appendChild(chip);
          }
        });
      }

      grid.appendChild(cell);
    }

    const lastDow = new Date(year, month, daysInMonth).getDay();
    for (let i = lastDow + 1; i <= 6; i++) {
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }

    block.appendChild(grid);
    root.appendChild(block);
  });

  updateStats();
}
