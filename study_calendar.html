<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시각디자인산업기사 학습 플래너</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F1EEE7;
  --paper-line:#DAD5C9;
  --ink:#191817;
  --ink-soft:#5B584F;
  --cyan:#00A9CE;
  --magenta:#D6247A;
  --yellow:#F2B705;
  --key:#191817;
  --card:#FBFAF7;
  --done:#2E7D4F;
  --rest:#B9B4A6;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Sans KR', sans-serif;
  line-height:1.5;
  padding-bottom:80px;
}

/* header */
header{max-width:820px;margin:0 auto;padding:48px 22px 28px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;display:flex;gap:9px;align-items:center;margin-bottom:12px;}
.eyebrow .dot{width:6px;height:6px;background:var(--magenta);border-radius:50%;display:inline-block;}
h1{font-family:'Noto Serif KR', serif;font-weight:900;font-size:clamp(24px,5vw,36px);margin:0 0 6px;letter-spacing:-.01em;}
h1 em{font-style:normal;color:var(--magenta);}
.subtitle{color:var(--ink-soft);font-size:14px;margin-bottom:22px;}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ink);border:1px solid var(--ink);}
.stat{background:var(--card);padding:13px 14px;}
.stat .label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.07em;color:var(--ink-soft);text-transform:uppercase;}
.stat .value{font-family:'Noto Serif KR',serif;font-weight:700;font-size:22px;margin-top:3px;}
.stat .value span{font-size:12.5px;font-weight:500;color:var(--ink-soft);}

.press-track{display:flex;height:16px;border:1px solid var(--ink);background:var(--card);overflow:hidden;margin-top:14px;}
.press-seg{height:100%;flex:1;position:relative;}
.press-seg::after{content:'';position:absolute;inset:0;left:0;width:var(--fill,0%);transition:width .5s ease;}
.press-seg.c::after{background:var(--cyan);} .press-seg.m::after{background:var(--magenta);}
.press-seg.y::after{background:var(--yellow);} .press-seg.k::after{background:var(--key);}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:8px;height:8px;display:inline-block;}
.legend .c-이론 i{background:var(--cyan);} .legend .c-모의고사 i{background:var(--magenta);}
.legend .c-기출문제 i{background:var(--yellow);} .legend .c-총복습 i{background:var(--key);}
.legend .c-복습일 i{background:var(--rest);}

.jump{margin-top:16px;}
.jump button{font-family:'IBM Plex Mono',monospace;font-size:11.5px;border:1px solid var(--ink);background:var(--card);padding:7px 12px;cursor:pointer;}
.jump button:hover{background:var(--ink);color:#fff;}

/* 오늘 패널 */
.today-panel{max-width:820px;margin:0 auto 28px;padding:0 22px;}
.today-card{border:1.5px solid var(--ink);background:var(--card);padding:18px 20px;position:relative;}
.today-card .tcap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--magenta);text-transform:uppercase;margin-bottom:6px;}
.today-card .tdate{font-family:'Noto Serif KR',serif;font-weight:900;font-size:20px;margin-bottom:10px;}
.today-item{display:flex;align-items:flex-start;gap:10px;padding:6px 0;}
.today-item .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);min-width:52px;padding-top:2px;}

/* 매일 루틴 (고정) */
.routine-panel{max-width:820px;margin:0 auto 30px;padding:0 22px;}
.routine-card{border:1px dashed var(--ink-soft);background:var(--card);padding:16px 20px;}
.routine-card .rcap{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:4px;}
.routine-card .rdesc{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
.routine-list{list-style:none;margin:0;padding:0;}
.routine-list li{padding:5px 0;}

/* checkbox 공통 */
.chk{display:flex;align-items:flex-start;gap:9px;cursor:pointer;width:100%;}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--ink);flex-shrink:0;margin-top:2px;cursor:pointer;position:relative;background:var(--card);}
.chk input[type=checkbox]:checked{background:var(--done);border-color:var(--done);}
.chk input[type=checkbox]:checked::after{content:'';position:absolute;left:4px;top:0px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg);}
.chk .txt{font-size:14px;}
.chk input:checked ~ .txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--done);}

/* 월별 캘린더 */
main{max-width:820px;margin:0 auto;padding:0 22px;}
.month{border:1px solid var(--paper-line);background:var(--card);margin-top:14px;}
.month[open]{border-color:var(--ink);}
.month summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px;}
.month summary::-webkit-details-marker{display:none;}
.m-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:16px;flex:1;}
.m-pct{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--done);}
.chev{width:8px;height:8px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-45deg);transition:transform .2s;flex-shrink:0;}
.month[open] .chev{transform:rotate(45deg);}

.day-list{border-top:1px solid var(--paper-line);}
.day-row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;padding:14px 18px;border-bottom:1px solid var(--paper-line);}
.day-row:last-child{border-bottom:none;}
.day-row.today{background:rgba(214,36,122,.06);}
.day-row.sun{background:rgba(0,0,0,.02);}
.d-date{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);padding-top:2px;text-align:center;}
.d-date b{display:block;font-family:'Noto Serif KR',serif;font-size:17px;color:var(--ink);font-weight:700;}
.d-main{min-width:0;}
.d-topline{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.d-dot{width:8px;height:8px;flex-shrink:0;}
.dot-이론{background:var(--cyan);} .dot-모의고사{background:var(--magenta);}
.dot-기출문제{background:var(--yellow);} .dot-총복습{background:var(--key);}
.dot-복습일{background:var(--rest);}
.d-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
.d-rest{font-size:13px;color:var(--ink-soft);font-style:italic;}

/* 링크 버튼 (요약정리/문제) */
.d-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.d-linkbtn{
  flex:1;min-width:150px;display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--paper-line);background:#fff;padding:9px 12px;
  text-decoration:none;color:var(--ink);transition:border-color .15s;
}
.d-linkbtn:hover{border-color:currentColor;}
.d-linkbtn .icon{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid currentColor;}
.d-linkbtn .icon svg{width:15px;height:15px;}
.d-linkbtn .txt2{min-width:0;}
.d-linkbtn .t1{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;line-height:1.3;}
.d-linkbtn .t2{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.d-linkbtn.summary{color:var(--cyan);}
.d-linkbtn.quiz{color:var(--magenta);}
.d-linkbtn.review{color:var(--ink-soft);border-style:dashed;flex:1 1 100%;cursor:pointer;}
.d-linkbtn.review:hover{border-color:var(--ink);color:var(--ink);}

footer{max-width:820px;margin:36px auto 0;padding:0 22px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.reset-btn{background:none;border:1px solid var(--ink-soft);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 10px;cursor:pointer;}
.reset-btn:hover{border-color:var(--ink);color:var(--ink);}

@media(max-width:520px){
  .stat-row{grid-template-columns:1fr;}
  .day-row{grid-template-columns:40px 1fr;padding:12px 14px;}
  .d-linkbtn{min-width:0;}
}
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span>SEOUL · VISUAL DESIGN INDUSTRIAL ENGINEER · 2026.08 – 2027.02</div>
  <h1>시각디자인<em>산업기사</em> 하루 학습 체크</h1>
  <div class="subtitle">하루에 하나씩 진도를 체크하고, 매일 반복해야 할 항목은 따로 관리합니다.</div>

  <div class="stat-row">
    <div class="stat"><div class="label">D-day</div><div class="value" id="dday">–</div></div>
    <div class="stat"><div class="label">진도율</div><div class="value" id="pctval">0<span>%</span></div></div>
    <div class="stat"><div class="label">완료</div><div class="value" id="donecount">0<span>&nbsp;/&nbsp;61</span></div></div>
  </div>
  <div class="press-track">
    <div class="press-seg c" id="seg-c"></div><div class="press-seg m" id="seg-m"></div>
    <div class="press-seg y" id="seg-y"></div><div class="press-seg k" id="seg-k"></div>
  </div>
  <div class="legend">
    <span class="c-이론"><i></i>이론편</span>
    <span class="c-모의고사"><i></i>모의고사</span>
    <span class="c-기출문제"><i></i>기출문제</span>
    <span class="c-총복습"><i></i>총복습</span>
    <span class="c-복습일"><i></i>복습·휴식일</span>
  </div>
  <div class="jump"><button id="jumpBtn">오늘로 이동</button></div>
</header>

<div class="today-panel">
  <div class="today-card">
    <div class="tcap">TODAY</div>
    <div class="tdate" id="todayDate">–</div>
    <div id="todayBody"></div>
  </div>
</div>

<div class="routine-panel">
  <div class="routine-card">
    <div class="rcap">매일 익혀야 할 것 · DAILY ROUTINE</div>
    <div class="rdesc">진도와 별개로, 시험일까지 매일 반복하면 좋은 습관입니다. 매일 새로 체크하세요.</div>
    <ul class="routine-list" id="routineList"></ul>
  </div>
</div>

<main id="months"></main>

<footer>
  <span>체크 기록은 이 브라우저에 자동 저장됩니다.</span>
  <button class="reset-btn" id="resetBtn">전체 초기화</button>
</footer>

<script>
const START = new Date(2026,7,24);   // 2026-08-24
const TARGET = new Date(2027,1,1);   // 2027-02-01
const todayObj = new Date(); todayObj.setHours(0,0,0,0);

// ---- 아이콘 (SVG) ----
const ICON_DOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>';
const ICON_PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1-5L16 4l4 4L9 19l-5 1z"/><path d="M13 6l4 4"/></svg>';
const ICON_REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v5h-5M6 21v-5h5"/></svg>';

// ---- 챕터별 학습 페이지 링크 (CH01~06만 존재) ----
const BASE_URL = 'https://kimjiheon1982go.github.io/Visual-Design-Industrial-Engineer/';
const CHAPTER_LINKS = [
  {ebook: BASE_URL+'ebook_Part01_CH01.html', test: BASE_URL+'test25_Part01_CH01.html'},
  {ebook: BASE_URL+'ebook_Part01_CH02.html', test: BASE_URL+'test25_Part01_CH02.html'},
  {ebook: BASE_URL+'ebook_Part01_CH03.html', test: BASE_URL+'test25_Part01_CH03.html'},
  {ebook: BASE_URL+'ebook_Part01_CH04.html', test: BASE_URL+'test25_Part01_CH04.html'},
  {ebook: BASE_URL+'ebook_Part01_CH05.html', test: BASE_URL+'test25_Part01_CH05.html'},
  {ebook: BASE_URL+'ebook_Part01_CH06.html', test: BASE_URL+'test25_Part01_CH06.html'},
  {ebook: BASE_URL+'ebook_Part02_CH01.html', test: BASE_URL+'test25_Part02_CH01.html'},
];

// ---- 커리큘럼 원본 (순서대로 소진) ----
const CURRICULUM = [
 ['이론','Part1 CH01 디자인의 개요'],['이론','Part1 CH02 시각 커뮤니케이션의 이해'],['이론','Part1 CH03 시각디자인 관리'],
 ['이론','Part1 CH04 시장 환경 조사 및 분석'],['이론','Part1 CH05 디자인 트렌드 조사 및 분석'],['이론','Part1 CH06 사용자 조사 및 분석'],
 ['이론','Part2 CH01 프로젝트 결과보고서 정리'],['이론','Part2 CH02 데이터베이스 관리'],['이론','Part2 CH03 지식재산권 확보'],['이론','Part2 CH04 디자인 저작권 관리'],
 ['이론','Part3 CH01 디자인 자료 조사'],['이론','Part3 CH02 디자인 자료 선정'],['이론','제1과목 연습문제 풀이'],
 ['이론','Part1 CH01 디자인 요소 수집'],['이론','Part1 CH02 디자인사'],['이론','Part1 CH03 아트웍'],['이론','Part1 CH04 베리에이션'],
 ['이론','Part2 CH01 디자인 요소 응용'],['이론','Part2 CH02 아트웍 응용화'],
 ['이론','Part3 CH01 프로젝트 준비'],['이론','Part3 CH02 프로젝트 계획'],['이론','Part3 CH03 프로젝트 계약문서 준비'],['이론','제2과목 연습문제 풀이'],
 ['이론','Part1 CH01 아이디어 구상 및 전개'],['이론','Part1 CH02 아이디어 스케치 구상 및 전개'],
 ['이론','Part2 CH01 아이디어 적용'],['이론','Part2 CH02 비주얼 방향 전개 및 적용'],
 ['이론','Part3 CH01 편집디자인 레이아웃 구현'],['이론','Part3 CH02 타이포그래피 적용'],['이론','Part3 CH03 색상 선택'],
 ['이론','Part4 CH01 완성 레이아웃 수정'],['이론','Part4 CH02 인쇄상태 점검'],['이론','Part4 CH03 후가공 상태 점검'],
 ['모의고사','1회 모의고사 풀이 및 채점'],['모의고사','2회 모의고사 풀이 및 채점'],['모의고사','3회 모의고사 풀이 및 채점'],['모의고사','4회 모의고사 풀이 및 채점'],
 ['모의고사','5회 모의고사 풀이 및 채점'],['모의고사','6회 모의고사 풀이 및 채점'],['모의고사','7회 모의고사 풀이 및 채점'],['모의고사','8회 모의고사 풀이 및 채점'],
 ['모의고사','9회 모의고사 풀이 및 채점'],['모의고사','10회 모의고사 풀이 및 채점'],['모의고사','11회 모의고사 풀이 및 채점'],['모의고사','12회 모의고사 풀이 및 채점'],
 ['기출문제','2011년 2회 기사 A형 기출문제'],['기출문제','2012년 2회 기사 A형 기출문제'],['기출문제','2013년 2회 기사 A형 기출문제'],['기출문제','2014년 2회 기사 A형 기출문제'],
 ['기출문제','2015년 2회 기사 B형 기출문제'],['기출문제','2016년 2회 기사 A형 기출문제'],['기출문제','2017년 2회 기사 A형 기출문제'],['기출문제','2018년 2회 기사 A형 기출문제'],
 ['기출문제','2019년 2회 기사 A형 기출문제'],['기출문제','2020년 1·2회 기사 A형 기출문제'],['기출문제','2021년 2회 기사 A형 기출문제'],['기출문제','2022년 2회 기사 A형 기출문제'],
 ['총복습','오답노트 재정리'],['총복습','과목별 핵심 키워드 요약노트 점검'],['총복습','취약 챕터 재학습'],['총복습','전체 체크리스트 최종 점검'],
];

const ROUTINE = [
 '전공 용어(디자인·인쇄·타이포) 5개씩 암기',
 '어제 헷갈렸던 문제 1개 다시 풀어보기',
 '오늘 학습 내용 3줄 요약 노트 작성',
];

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function sameDay(a,b){return iso(a)===iso(b);}

// ---- 날짜별 큐레이션: 월~토는 진도, 일요일은 복습일 ----
const days = [];
let cIdx = 0;
for(let d=new Date(START); d<=TARGET; d=addDays(d,1)){
  const dow = d.getDay(); // 0=Sun
  let entry = {date:new Date(d), dow};
  if(dow===0){
    entry.rest = true;
    entry.tag = '복습일';
  } else if(cIdx < CURRICULUM.length){
    entry.phase = CURRICULUM[cIdx][0];
    entry.text = CURRICULUM[cIdx][1];
    entry.curriculumIndex = cIdx;
    cIdx++;
  } else {
    entry.rest = true;
    entry.tag = '복습일';
  }
  days.push(entry);
}
const TOTAL_ITEMS = CURRICULUM.length;

// ---- 저장소: localStorage (정적 페이지 배포용) ----
const STORAGE_KEY = 'vd-planner-state-v1';
let state = {topics:{}, routine:{}};
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ console.error('불러오기 실패', e); }
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.error('저장 실패', e); }
  },200);
}

const dayNamesKo=['일','월','화','수','목','금','토'];
function fmtDateBig(d){ return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' ('+dayNamesKo[d.getDay()]+')'; }

function linkButtonsHtml(curriculumIndex){
  if(curriculumIndex===undefined || curriculumIndex>=CHAPTER_LINKS.length) return '';
  const links = CHAPTER_LINKS[curriculumIndex];
  return `<div class="d-actions">
    <a class="d-linkbtn summary" href="${links.ebook}" target="_blank" rel="noopener">
      <span class="icon">${ICON_DOC}</span>
      <span class="txt2"><span class="t1">요약정리</span><span class="t2">핵심 내용을 정리해보세요</span></span>
    </a>
    <a class="d-linkbtn quiz" href="${links.test}" target="_blank" rel="noopener">
      <span class="icon">${ICON_PENCIL}</span>
      <span class="txt2"><span class="t1">문제 (25문항)</span><span class="t2">실력을 테스트해보세요</span></span>
    </a>
  </div>`;
}

function renderRoutine(){
  const key = iso(todayObj);
  const list = document.getElementById('routineList');
  list.innerHTML = ROUTINE.map((txt,i)=>{
    const id = key+'-r'+i;
    const checked = !!state.routine[id];
    return `<li><label class="chk"><input type="checkbox" data-rid="${id}" ${checked?'checked':''}><span class="txt">${txt}</span></label></li>`;
  }).join('');
  list.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',()=>{ state.routine[cb.dataset.rid]=cb.checked; saveState(); });
  });
}

function renderToday(){
  const todayEntry = days.find(e=>sameDay(e.date, todayObj));
  document.getElementById('todayDate').textContent = fmtDateBig(todayObj);
  const body = document.getElementById('todayBody');
  if(!todayEntry){
    body.innerHTML = '<div class="d-rest">플래너 기간(2026.08.24–2027.02.01) 밖입니다.</div>';
    return;
  }
  if(todayEntry.rest){
    body.innerHTML = '<div class="today-item"><span class="lbl">진도</span><span class="d-rest">오늘은 복습·휴식일입니다. 아래 데일리 루틴만 챙겨보세요.</span></div>';
  } else {
    const id = iso(todayEntry.date);
    const checked = !!state.topics[id];
    body.innerHTML = `<div class="today-item"><span class="lbl">${todayEntry.phase}</span>
      <label class="chk"><input type="checkbox" id="todayChk" ${checked?'checked':''}><span class="txt">${todayEntry.text}</span></label></div>
      ${linkButtonsHtml(todayEntry.curriculumIndex)}`;
    document.getElementById('todayChk').addEventListener('change', e=>{
      state.topics[id]=e.target.checked; saveState(); renderMonths();
    });
  }
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(d){ return d.getFullYear()+'년 '+(d.getMonth()+1)+'월'; }

function renderMonths(){
  const container = document.getElementById('months');
  const openState = {};
  container.querySelectorAll('.month').forEach(m=>{ openState[m.dataset.mk]=m.open; });
  container.innerHTML='';

  const groups = {};
  days.forEach(e=>{
    const mk = monthKey(e.date);
    (groups[mk] = groups[mk]||[]).push(e);
  });

  const curMk = monthKey(todayObj);

  Object.keys(groups).forEach(mk=>{
    const list = groups[mk];
    const itemDays = list.filter(e=>!e.rest);
    const doneN = itemDays.filter(e=>state.topics[iso(e.date)]).length;
    const pct = itemDays.length ? Math.round(doneN/itemDays.length*100) : 100;

    const det = document.createElement('details');
    det.className='month';
    det.dataset.mk = mk;
    det.open = openState.hasOwnProperty(mk) ? openState[mk] : (mk===curMk);

    const rows = list.map(e=>{
      const isToday = sameDay(e.date, todayObj);
      if(e.rest){
        return `<div class="day-row ${isToday?'today':''} ${e.dow===0?'sun':''}">
          <div class="d-date"><b>${e.date.getDate()}</b>${dayNamesKo[e.dow]}</div>
          <div class="d-main">
            <div class="d-topline"><span class="d-dot dot-복습일"></span><span class="d-tag">복습·휴식</span></div>
            <div class="d-rest">지난 진도 복습 / 데일리 루틴</div>
            <div class="d-actions">
              <span class="d-linkbtn review" data-scroll="routine">
                <span class="icon">${ICON_REFRESH}</span>
                <span class="txt2"><span class="t1">복습 / 데일리 루틴</span><span class="t2">지난 진도를 복습하고 데일리 루틴을 완료하세요</span></span>
              </span>
            </div>
          </div>
        </div>`;
      }
      const id = iso(e.date);
      const checked = !!state.topics[id];
      return `<div class="day-row ${isToday?'today':''}">
        <div class="d-date"><b>${e.date.getDate()}</b>${dayNamesKo[e.dow]}</div>
        <div class="d-main">
          <div class="d-topline"><span class="d-dot dot-${e.phase}"></span><span class="d-tag">${e.phase}</span></div>
          <label class="chk"><input type="checkbox" data-id="${id}" ${checked?'checked':''}><span class="txt">${e.text}</span></label>
          ${linkButtonsHtml(e.curriculumIndex)}
        </div>
      </div>`;
    }).join('');

    det.innerHTML = `<summary><span class="m-title">${monthLabel(list[0].date)}</span><span class="m-pct">${pct}%</span><span class="chev"></span></summary>
      <div class="day-list">${rows}</div>`;
    container.appendChild(det);

    det.querySelectorAll('.day-list input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        state.topics[cb.dataset.id]=cb.checked;
        saveState();
        updateHeader();
        renderToday();
        const itemDays2 = list.filter(e=>!e.rest);
        const doneN2 = itemDays2.filter(e=>state.topics[iso(e.date)]).length;
        det.querySelector('.m-pct').textContent = Math.round(doneN2/itemDays2.length*100)+'%';
      });
    });
    det.querySelectorAll('.d-linkbtn.review').forEach(el=>{
      el.addEventListener('click', ()=>{
        document.querySelector('.routine-panel').scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  });
}

function updateHeader(){
  let done=0;
  days.forEach(e=>{ if(!e.rest && state.topics[iso(e.date)]) done++; });
  const pct = Math.round(done/TOTAL_ITEMS*100);
  document.getElementById('pctval').innerHTML = pct+'<span>%</span>';
  document.getElementById('donecount').innerHTML = done+'<span>&nbsp;/&nbsp;'+TOTAL_ITEMS+'</span>';
  const segs=['c','m','y','k'];
  segs.forEach((s,i)=>{
    const el=document.getElementById('seg-'+s);
    const lower=i*25, upper=(i+1)*25;
    let fill=0;
    if(pct>=upper) fill=100; else if(pct>lower) fill=(pct-lower)/25*100;
    el.style.setProperty('--fill', fill+'%');
  });
  const diff = Math.round((TARGET - todayObj)/86400000);
  document.getElementById('dday').textContent = diff>0?('D-'+diff):(diff===0?'D-DAY':('D+'+Math.abs(diff)));
}

document.getElementById('jumpBtn').addEventListener('click', ()=>{
  const mk = monthKey(todayObj);
  const el = document.querySelector('.month[data-mk="'+mk+'"]');
  if(el){ el.open = true; el.scrollIntoView({behavior:'smooth', block:'start'}); }
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('모든 체크 기록을 초기화할까요? 되돌릴 수 없습니다.')) return;
  state = {topics:{}, routine:{}};
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  renderToday(); renderRoutine(); renderMonths(); updateHeader();
});

loadState();
renderToday();
renderRoutine();
renderMonths();
updateHeader();
</script>
</body>
</html>
