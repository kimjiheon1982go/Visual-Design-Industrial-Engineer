<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시각디자인산업기사 필기 D-21 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F2E9;
    --paper-dim: #EFE9DA;
    --ink: #211D18;
    --ink-soft: #55503F;
    --line: #DCD3BC;
    --gold: #B08D46;
    --gold-soft: #E7D9AE;
    --s1: #2F5233;   /* 조사·분석 - 포레스트 그린 */
    --s1-bg: #E8EEE6;
    --s2: #8A4B32;   /* 기획·구상 - 테라코타 */
    --s2-bg: #F3E7DE;
    --s3: #3C4A6B;   /* 제작 - 인디고 네이비 */
    --s3-bg: #E7E9F0;
    --review: #7A3B3B; /* 총복습·모의고사 - 와인레드 */
    --review-bg: #F1E3E1;
    --done: #A9A18A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family:'IBM Plex Sans KR', sans-serif;
    padding: 40px 24px 80px;
  }
  .wrap{ max-width: 1180px; margin: 0 auto; }

  /* Header */
  header{
    display:flex; flex-wrap:wrap; gap:28px;
    justify-content:space-between; align-items:flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 22px;
    margin-bottom: 30px;
  }
  .title-block .eyebrow{
    font-size: 12.5px; letter-spacing: 0.22em; color: var(--gold);
    text-transform: uppercase; font-weight:600; margin-bottom:8px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900; font-size: clamp(26px, 3.4vw, 40px);
    margin:0; line-height:1.25;
  }
  .subtitle{ margin-top:8px; color: var(--ink-soft); font-size:14.5px; }

  .dday-box{
    background: var(--ink); color: var(--paper);
    border-radius: 4px; padding: 16px 26px;
    text-align:center; min-width:150px;
  }
  .dday-box .num{
    font-family:'Noto Serif KR', serif; font-weight:900;
    font-size: 40px; color: var(--gold-soft); line-height:1;
  }
  .dday-box .lab{ font-size:12px; letter-spacing:0.15em; margin-top:6px; opacity:.85;}

  /* Progress */
  .progress-panel{
    display:flex; align-items:center; gap:18px;
    margin-bottom: 34px; flex-wrap:wrap;
  }
  .progress-track{
    flex:1; min-width:220px; height:10px; background: var(--paper-dim);
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background: linear-gradient(90deg, var(--s1), var(--gold));
    width:0%; transition: width .4s ease;
  }
  .progress-text{ font-size:13.5px; color: var(--ink-soft); white-space:nowrap; font-weight:600;}
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color: var(--ink-soft);}
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* Week label rows */
  .week-label{
    font-family:'Noto Serif KR', serif; font-weight:700; font-size:15px;
    color: var(--ink); margin: 30px 0 12px; display:flex; align-items:center; gap:10px;
  }
  .week-label::after{ content:""; flex:1; height:1px; background: var(--line); }

  .grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }
  @media (max-width: 860px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }

  .day-card{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    padding:14px 14px 16px; display:flex; flex-direction:column;
    min-height: 190px; position:relative; transition: box-shadow .2s ease;
  }
  .day-card.today{ outline: 2px solid var(--gold); outline-offset:2px; }
  .day-card.exam{
    background: linear-gradient(160deg, var(--ink) 0%, #33291f 100%);
    color: var(--paper); border-color: var(--ink);
  }
  .day-card.exam .date-num, .day-card.exam .weekday{ color: var(--gold-soft); }

  .day-card .date-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .date-num{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:19px; }
  .weekday{ font-size:11.5px; color: var(--ink-soft); font-weight:600; }

  .subject-tag{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em;
    padding: 2px 8px; border-radius: 20px; margin-bottom:9px; align-self:flex-start;
  }
  .tag-s1{ background: var(--s1-bg); color: var(--s1); }
  .tag-s2{ background: var(--s2-bg); color: var(--s2); }
  .tag-s3{ background: var(--s3-bg); color: var(--s3); }
  .tag-review{ background: var(--review-bg); color: var(--review); }
  .tag-exam{ background: var(--gold); color: var(--ink); }

  ul.items{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; flex:1; }
  .item{ display:flex; align-items:flex-start; gap:7px; font-size:12.6px; line-height:1.4; cursor:pointer; }
  .item input{
    margin-top:2px; width:14px; height:14px; accent-color: var(--s1);
    flex-shrink:0; cursor:pointer;
  }
  .day-card.exam .item input{ accent-color: var(--gold); }
  .item span.txt{ transition: color .15s ease, opacity .15s ease; }
  .item.checked span.txt{ color: var(--done); text-decoration: line-through; opacity: .75; }

  .day-progress{
    margin-top:10px; height:4px; background: var(--paper-dim); border-radius:3px; overflow:hidden;
  }
  .day-card.exam .day-progress{ background: rgba(255,255,255,0.15); }
  .day-progress-fill{ height:100%; background: var(--gold); width:0%; transition:width .3s ease; }

  footer{
    margin-top: 50px; padding-top:18px; border-top:1px solid var(--line);
    font-size:12px; color: var(--ink-soft); text-align:center;
  }
  .reset-btn{
    background:none; border:1px solid var(--line); color: var(--ink-soft);
    font-size:11.5px; padding:6px 14px; border-radius:20px; cursor:pointer;
    margin-top:10px; font-family:'IBM Plex Sans KR', sans-serif;
  }
  .reset-btn:hover{ border-color: var(--review); color: var(--review); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="eyebrow">2025 개정 교재 목차 기반 · 자체 편성</div>
      <h1>시각디자인산업기사 필기<br>21일 완성 캘린더</h1>
      <div class="subtitle">2026. 08. 03(월) — 2026. 08. 23(일) 시험일 · 매일 체크하며 진도를 기록하세요</div>
    </div>
    <div class="dday-box">
      <div class="num" id="ddayNum">D-21</div>
      <div class="lab">시험일 8월 23일(일)</div>
    </div>
  </header>

  <div class="progress-panel">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0 완료 (0%)</div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--s1)"></i>과목1 · 조사·분석</span>
    <span><i class="dot" style="background:var(--s2)"></i>과목2 · 기획·구상</span>
    <span><i class="dot" style="background:var(--s3)"></i>과목3 · 제작</span>
    <span><i class="dot" style="background:var(--review)"></i>모의고사·기출·복습</span>
    <span><i class="dot" style="background:var(--gold)"></i>D-DAY</span>
  </div>

  <div id="calendarRoot"></div>

  <footer>
    작성 기준: 첨부해주신 2025 시각디자인산업기사 필기 교재 목차<br>
    체크 상태는 자동 저장되며, 다시 열어도 유지됩니다.
    <br>
    <button class="reset-btn" id="resetBtn">전체 체크 초기화</button>
  </footer>

</div>

<script>
const DAYS = [
  { date:"08.03", wd:"월", tag:"s1", tagLabel:"과목1 · Part1", items:[
    "CH1 디자인의 개요","CH2 시각 커뮤니케이션의 이해","CH3 시각디자인 관리"
  ]},
  { date:"08.04", wd:"화", tag:"s1", tagLabel:"과목1 · Part1", items:[
    "CH4 시장 환경 조사 및 분석","CH5 디자인 트렌드 조사 및 분석","CH6 사용자 조사 및 분석"
  ]},
  { date:"08.05", wd:"수", tag:"s1", tagLabel:"과목1 · Part2", items:[
    "CH1 프로젝트 결과보고서 정리","CH2 데이터베이스 관리","CH3 지식재산권 확보","CH4 디자인 저작권 관리"
  ]},
  { date:"08.06", wd:"목", tag:"s1", tagLabel:"과목1 · Part3 + 연습문제", items:[
    "CH1 디자인 자료 조사","CH2 디자인 자료 선정","제1과목 연습문제 풀이"
  ]},
  { date:"08.07", wd:"금", tag:"s2", tagLabel:"과목2 · Part1", items:[
    "CH1 디자인 요소 수집","CH2 디자인사","CH3 아트웍","CH4 베리에이션"
  ]},
  { date:"08.08", wd:"토", tag:"s2", tagLabel:"과목2 · Part2~3", items:[
    "CH1 디자인 요소 응용","CH2 아트웍 응용화","CH1 프로젝트 준비"
  ]},
  { date:"08.09", wd:"일", tag:"s2", tagLabel:"과목2 · Part3 + 연습문제", items:[
    "CH2 프로젝트 계획","CH3 프로젝트 계약문서 준비","제2과목 연습문제 풀이"
  ]},
  { date:"08.10", wd:"월", tag:"s3", tagLabel:"과목3 · Part1", items:[
    "CH1 아이디어 구상 및 전개","CH2 아이디어 스케치 구상 및 전개"
  ]},
  { date:"08.11", wd:"화", tag:"s3", tagLabel:"과목3 · Part2", items:[
    "CH1 아이디어 적용","CH2 비주얼 방향 전개 및 적용"
  ]},
  { date:"08.12", wd:"수", tag:"s3", tagLabel:"과목3 · Part3", items:[
    "CH1 편집디자인 레이아웃 구현","CH2 타이포그래피 적용","CH3 색상 선택"
  ]},
  { date:"08.13", wd:"목", tag:"s3", tagLabel:"과목3 · Part4 + 연습문제", items:[
    "CH1 완성 레이아웃 수정","CH2 인쇄상태 점검","CH3 후가공 상태 점검","제3과목 연습문제 풀이"
  ]},
  { date:"08.14", wd:"금", tag:"review", tagLabel:"이론 총복습", items:[
    "전 과목 핵심 개념 재정리","오답노트 작성 시작","취약 챕터 표시"
  ]},
  { date:"08.15", wd:"토", tag:"review", tagLabel:"모의고사 1~3회", items:[
    "1회 모의고사 풀이 및 채점","2회 모의고사 풀이 및 채점","3회 모의고사 풀이 및 채점"
  ]},
  { date:"08.16", wd:"일", tag:"review", tagLabel:"모의고사 4~6회", items:[
    "4회 모의고사 풀이 및 채점","5회 모의고사 풀이 및 채점","6회 모의고사 풀이 및 채점"
  ]},
  { date:"08.17", wd:"월", tag:"review", tagLabel:"모의고사 7~9회", items:[
    "7회 모의고사 풀이 및 채점","8회 모의고사 풀이 및 채점","9회 모의고사 풀이 및 채점"
  ]},
  { date:"08.18", wd:"화", tag:"review", tagLabel:"모의고사 10~12회", items:[
    "10회 모의고사 풀이 및 채점","11회 모의고사 풀이 및 채점","12회 모의고사 풀이 및 채점"
  ]},
  { date:"08.19", wd:"수", tag:"review", tagLabel:"기출문제 2011~2016", items:[
    "2011년 2회 기출 풀이","2012년 2회 기출 풀이","2013년 2회 기출 풀이",
    "2014년 2회 기출 풀이","2015년 2회 기출 풀이","2016년 2회 기출 풀이"
  ]},
  { date:"08.20", wd:"목", tag:"review", tagLabel:"기출문제 2017~2022", items:[
    "2017년 2회 기출 풀이","2018년 2회 기출 풀이","2019년 2회 기출 풀이",
    "2020년 1·2회 기출 풀이","2021년 2회 기출 풀이","2022년 2회 기출 풀이"
  ]},
  { date:"08.21", wd:"금", tag:"review", tagLabel:"오답노트 총정리", items:[
    "모의고사·기출 오답 전체 재검토","취약 파트 재학습(교재 재확인)","암기 카드/요약본 업데이트"
  ]},
  { date:"08.22", wd:"토", tag:"review", tagLabel:"최종 총정리", items:[
    "전 과목 요약노트 훑기","핵심 키워드·법령·연도 암기","준비물 점검(신분증, 수험표, 필기구)"
  ]},
  { date:"08.23", wd:"일", tag:"exam", tagLabel:"D-DAY 시험일", items:[
    "최종 컨디션 관리 (충분한 수면)","입실시간 확인 및 시험장 도착","가벼운 요약노트만 최종 확인"
  ]},
];

const TAG_LABELS = { s1:"tag-s1", s2:"tag-s2", s3:"tag-s3", review:"tag-review", exam:"tag-exam" };
const WEEK_TITLES = ["1주차 (08.03 ~ 08.09)","2주차 (08.10 ~ 08.16)","3주차 (08.17 ~ 08.23)"];

const todayStr = (() => {
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return mm + "." + dd;
})();

let checklist = {};

function itemId(dayIdx, itemIdx){ return "d" + dayIdx + "-i" + itemIdx; }

const STORAGE_KEY = 'visdes-industry-study-checklist';

async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ checklist = JSON.parse(raw); }
  }catch(e){ checklist = {}; }
}

async function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(checklist));
  }catch(e){ console.error('저장 실패', e); }
}

function render(){
  const root = document.getElementById('calendarRoot');
  root.innerHTML = '';
  let weekIdx = -1;

  DAYS.forEach((day, dIdx) => {
    const w = Math.floor(dIdx / 7);
    if(w !== weekIdx){
      weekIdx = w;
      const label = document.createElement('div');
      label.className = 'week-label';
      label.textContent = WEEK_TITLES[w] || ("" + (w+1) + "주차");
      root.appendChild(label);
      const grid = document.createElement('div');
      grid.className = 'grid';
      grid.id = 'grid-' + w;
      root.appendChild(grid);
    }
    const grid = document.getElementById('grid-' + weekIdx);

    const card = document.createElement('div');
    card.className = 'day-card' + (day.tag === 'exam' ? ' exam' : '') + (day.date === todayStr ? ' today' : '');

    const dateRow = document.createElement('div');
    dateRow.className = 'date-row';
    dateRow.innerHTML = '<span class="date-num">' + day.date + '</span><span class="weekday">' + day.wd + '</span>';
    card.appendChild(dateRow);

    const tag = document.createElement('span');
    tag.className = 'subject-tag ' + TAG_LABELS[day.tag];
    tag.textContent = day.tagLabel;
    card.appendChild(tag);

    const ul = document.createElement('ul');
    ul.className = 'items';

    day.items.forEach((text, iIdx) => {
      const id = itemId(dIdx, iIdx);
      const li = document.createElement('li');
      li.className = 'item' + (checklist[id] ? ' checked' : '');
      li.innerHTML = '<input type="checkbox" ' + (checklist[id] ? 'checked' : '') + ' data-id="' + id + '"><span class="txt">' + text + '</span>';
      li.addEventListener('click', (e) => {
        if(e.target.tagName !== 'INPUT'){
          const cb = li.querySelector('input');
          cb.checked = !cb.checked;
        }
        toggleItem(id, li);
      });
      ul.appendChild(li);
    });

    card.appendChild(ul);

    const dayProg = document.createElement('div');
    dayProg.className = 'day-progress';
    const dayFill = document.createElement('div');
    dayFill.className = 'day-progress-fill';
    dayProg.appendChild(dayFill);
    card.appendChild(dayProg);

    grid.appendChild(card);
    updateDayProgress(day, dIdx, dayFill);
  });

  updateOverallProgress();
}

function updateDayProgress(day, dIdx, fillEl){
  const total = day.items.length;
  let done = 0;
  day.items.forEach((_, iIdx) => { if(checklist[itemId(dIdx, iIdx)]) done++; });
  fillEl.style.width = (total ? (done/total*100) : 0) + '%';
}

function toggleItem(id, liEl){
  checklist[id] = !checklist[id];
  liEl.classList.toggle('checked', checklist[id]);
  saveState();
  updateOverallProgress();
  render(); // re-render to refresh day progress bars accurately
}

function updateOverallProgress(){
  let total = 0, done = 0;
  DAYS.forEach((day, dIdx) => {
    day.items.forEach((_, iIdx) => {
      total++;
      if(checklist[itemId(dIdx, iIdx)]) done++;
    });
  });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + ' / ' + total + ' 완료 (' + pct + '%)';
}

function updateDday(){
  const examDate = new Date(2026, 7, 23); // month is 0-indexed: 7 = August
  const today = new Date();
  today.setHours(0,0,0,0);
  examDate.setHours(0,0,0,0);
  const diff = Math.round((examDate - today) / (1000*60*60*24));
  const el = document.getElementById('ddayNum');
  el.textContent = diff > 0 ? ('D-' + diff) : (diff === 0 ? 'D-DAY' : 'D+' + Math.abs(diff));
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(confirm('모든 체크 표시를 초기화할까요?')){
    checklist = {};
    await saveState();
    render();
  }
});

(async function init(){
  updateDday();
  await loadState();
  render();
})();
</script>
</body>
</html>
