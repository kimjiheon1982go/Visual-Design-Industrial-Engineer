<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#18212b;--muted:#667085;--line:#dfe3e8;--accent:#2563eb;--ok:#16803c;--bad:#d92d20;--warn:#b54708}
*{box-sizing:border-box} body{margin:0;font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111827;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
.top{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.title{font-size:18px;font-weight:800} .sub{font-size:12px;color:#b9c2d0;margin-top:4px}

.wrap{max-width:1180px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}

.qnav{height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:700} .qnav.answered{background:#e8f0ff;border-color:#91b6ff;color:#174ea6} .qnav.current{outline:2px solid var(--accent)} .qnav.unanswered{color:#98a2b3}
.exam{padding:30px;min-height:600px} .badge{display:inline-block;background:#eef4ff;color:#175cd3;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:18px}
.qno{font-size:14px;color:var(--muted);font-weight:700} h1{font-size:22px;line-height:1.55;margin:8px 0 28px;word-break:keep-all}
.options{display:grid;gap:11px} .opt{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff} .opt:hover{border-color:#9dbdff;background:#f8fbff} .opt.selected{border-color:var(--accent);background:#eff6ff;box-shadow:0 0 0 1px var(--accent)} .num{flex:0 0 28px;height:28px;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;font-size:13px;font-weight:800} .selected .num{background:var(--accent);color:#fff} .otxt{line-height:1.55;word-break:keep-all}
.controls{display:flex;justify-content:space-between;gap:10px;margin-top:32px;border-top:1px solid var(--line);padding-top:20px} button{font:inherit} .btn{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer} .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.danger{background:#fff0ef;border-color:#f7b4af;color:#b42318}
#results{display:none;max-width:1180px;margin:24px auto;padding:0 18px 40px} .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px} .stat{padding:20px;background:#fff;border:1px solid var(--line);border-radius:14px} .stat b{display:block;font-size:28px;margin-top:8px} .stat span{font-size:13px;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 26px} .subject-score{padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13px} .subject-score b{display:block;font-size:20px;margin-top:6px}
.review{display:grid;gap:14px} .wrong{padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px} .wrong h3{margin:0 0 10px;font-size:16px;line-height:1.55} .answerline{padding:12px;border-radius:9px;margin-top:8px;font-size:14px} .mine{background:#fff1f0;color:#9f1c16} .correct{background:#ecfdf3;color:#087443} .explain{margin-top:12px;padding:14px;background:#f8fafc;border-left:4px solid #94a3b8;line-height:1.65;font-size:14px}

<script>

function updateTimer(){let h=Math.floor(remain/3600),m=Math.floor(remain%3600/60),s=remain%60;document.getElementById("timer").textContent=[h,m,s].map((v,i)=>i?String(v).padStart(2,"0"):String(v).padStart(2,"0")).join(":");}
function renderNav(){const g=document.getElementById("qgrid");g.innerHTML=questions.map((q,i)=>`<button class="qnav ${answers[i]!==null?'answered':'unanswered'} ${i===current?'current':''}" onclick="go(${i})">${i+1}</button>`).join("");let c=answers.filter(x=>x!==null).length;document.getElementById("progressText").textContent=`${c} / 80 답안 선택`;document.getElementById("progressBar").style.width=`${c/80*100}%`;}
function renderQuestion(){const q=questions[current];document.getElementById("exam").innerHTML=`<div class="badge">${q.subject}</div><div class="qno">${q.no}번 / 80문항</div><h1>${q.question}</h1><div class="options">${q.options.map((o,i)=>`<div class="opt ${answers[current]===i?'selected':''}" onclick="choose(${i})"><div class="num">${letters[i]}</div><div class="otxt">${o}</div></div>`).join("")}</div><div class="controls"><button class="btn" onclick="go(${Math.max(0,current-1)})" ${current===0?'disabled':''}>← 이전</button><button class="btn primary" onclick="go(${Math.min(79,current+1)})">${current===79?'마지막 문제':'다음 문제'} →</button></div>`;}
function choose(i){answers[current]=i;renderNav();renderQuestion();}
function go(i){current=i;renderNav();renderQuestion();window.scrollTo({top:0,behavior:"smooth"});}
function finishConfirm(){let blank=answers.filter(x=>x===null).length;let msg=blank?`아직 ${blank}문제가 미응답입니다. 그래도 종료하고 채점하시겠습니까?`:"모든 문제를 풀었습니다. 채점하시겠습니까?";if(confirm(msg))finishExam(false);}
function finishExam(timeout){if(finished)return;finished=true;clearInterval(timerId);let correct=0;questions.forEach((q,i)=>{if(answers[i]===q.answer)correct++;});let wrong=questions.filter((q,i)=>answers[i]!==q.answer);document.getElementById("examArea").style.display="none";let r=document.getElementById("results");r.style.display="block";let unanswered=answers.filter(x=>x===null).length;let pct=(correct/80*100).toFixed(1);let subjectHtml=Object.values(questions.reduce((a,q,i)=>{(a[q.subject]??=[]).push(i);return a;},{})).map((idxs,si)=>{let name=questions[idxs[0]].subject;let c=idxs.filter(i=>answers[i]===questions[i].answer).length;return `<div class="subject-score">${name}<b>${c} / ${idxs.length}</b></div>`}).join("");let wrongHtml=wrong.length?wrong.map(q=>{let i=q.no-1;let mine=answers[i]===null?"미응답":`${letters[answers[i]]} ${q.options[answers[i]]}`;let corr=`${letters[q.answer]} ${q.options[q.answer]]}`;return `<article class="wrong"><div class="badge">${q.subject} · ${q.no}번</div><h3>${q.question}</h3><div class="answerline mine"><b>내 답:</b> ${mine}</div><div class="answerline correct"><b>정답:</b> ${corr}</div><div class="explain"><b>해답</b><br>${q.explanation}</div></article>`}).join(""):`<div class="empty">축하합니다. 모든 문제를 맞혔습니다!</div>`;
r.innerHTML=`<div class="result-card" style="padding:28px"><h2 style="margin-top:0">${timeout?"시간 종료 · 자동 채점 결과":"시험 채점 결과"}</h2><div class="summary"><div class="stat"><span>점수</span><b>${correct} / 80</b></div><div class="stat"><span>정답률</span><b>${pct}%</b></div><div class="stat"><span>오답</span><b>${80-correct}문제</b></div><div class="stat"><span>미응답</span><b>${unanswered}문제</b></div></div><h3>과목별 결과</h3><div class="subjects">${subjectHtml}</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" onclick="location.reload()">다시 시험 보기</button><button class="btn" onclick="document.getElementById('wrongList').scrollIntoView({behavior:'smooth'})">오답 보기</button></div></div><div id="wrongList" style="margin-top:24px"><h2>오답 및 해답</h2><div class="review">${wrongHtml}</div></div>`;window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body></html>
